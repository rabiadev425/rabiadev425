<svg width="760" height="170" viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="758" height="168" rx="14" fill="#111A2C" stroke="#2A4365" stroke-width="1"/>

  <!-- title row -->
  <text x="28" y="38" class="mono" font-size="13" fill="#8593AD" letter-spacing="1">RABIA.DEV — SYSTEM STATUS</text>

  <!-- status dot + ONLINE -->
  <circle cx="700" cy="34" r="5" fill="#4FD1A5">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="712" y="38" class="mono" font-size="12" fill="#4FD1A5">ONLINE</text>

  <!-- divider -->
  <line x1="28" y1="52" x2="732" y2="52" stroke="#24314d" stroke-width="1"/>

  <!-- Product Layer bar -->
  <text x="28" y="80" class="label" font-size="13" fill="#E8A33D">PRODUCT LAYER</text>
  <text x="700" y="80" class="mono" font-size="12" fill="#8593AD" text-anchor="end">MERN</text>
  <rect x="28" y="88" width="674" height="8" rx="4" fill="#1a2438"/>
  <rect x="28" y="88" height="8" rx="4" fill="#E8A33D">
    <animate attributeName="width" values="0;640;640" keyTimes="0;0.6;1" dur="3.2s" fill="freeze"/>
  </rect>

  <!-- Intelligence Layer bar -->
  <text x="28" y="118" class="label" font-size="13" fill="#4FD1A5">INTELLIGENCE LAYER</text>
  <text x="700" y="118" class="mono" font-size="12" fill="#8593AD" text-anchor="end">LLM</text>
  <rect x="28" y="126" width="674" height="8" rx="4" fill="#1a2438"/>
  <rect x="28" y="126" height="8" rx="4" fill="#4FD1A5">
    <animate attributeName="width" values="0;560;560" keyTimes="0;0.6;1" dur="3.2s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- footer -->
  <text x="28" y="155" class="mono" font-size="11" fill="#5b6785">Shipping continuously — building the product and the intelligence layer, together.</text>
</svg>
